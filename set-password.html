<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Thiết lập mật khẩu | Tân Design</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#22312b;background:#f3f5f1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,480px);background:white;border:1px solid #dce5dc;border-radius:18px;padding:32px;box-shadow:0 12px 35px #233c2512}
h1{font-size:1.6rem;margin:8px 0 12px}p{line-height:1.6}label{display:block;font-weight:600;margin:18px 0 8px}
input{width:100%;font:inherit;padding:12px;border:1px solid #95a69b;border-radius:8px}
button{font:inherit;width:100%;margin-top:22px;border:0;border-radius:8px;background:#264f39;color:white;padding:13px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}a{color:#235b3c}#status{min-height:36px;color:#a12828}#status.ok{color:#14653a}
.hide{display:none}.muted{color:#58675e;font-size:.95rem}
</style>
</head>
<body>
<main>
<p class="muted">TÂN DESIGN · TÀI KHOẢN NHÂN VIÊN</p>
<h1>Thiết lập mật khẩu</h1>
<p class="muted">Mở trang này từ liên kết trong email mời để tạo mật khẩu đăng nhập.</p>
<p id="status" role="status" aria-live="polite">Đang xác minh liên kết mời…</p>
<form id="password-form" class="hide">
<label for="new-password">Mật khẩu mới</label>
<input type="password" id="new-password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="confirm-password">Nhập lại mật khẩu</label>
<input type="password" id="confirm-password" minlength="12" maxlength="128" autocomplete="new-password" required>
<p class="muted">Sử dụng ít nhất 12 ký tự, không dùng mật khẩu đã chia sẻ với người khác.</p>
<button type="submit" id="submit-password">Lưu mật khẩu</button>
</form>
<p><a href="./admin.html">Quay về đăng nhập</a></p>
</main>
<script src="./app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script>
(async () => {
  "use strict";
  const status=document.getElementById("status");
  const form=document.getElementById("password-form");
  const button=document.getElementById("submit-password");
  function message(text,ok=false){status.textContent=text;status.classList.toggle("ok",ok)}
  const fragment=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  if(fragment.get("error")||query.get("error")){
    message("Liên kết không hợp lệ hoặc đã hết hạn. Vui lòng liên hệ Admin để được mời lại.");return;
  }
  const cfg=window.ATELIER_CONFIG;
  if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey||!window.supabase?.createClient){
    message("Không thể kết nối Supabase. Vui lòng thử lại hoặc liên hệ Admin.");return;
  }
  const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{
    auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}
  });
  try{
    const {data,error}=await client.auth.getSession();
    if(error||!data.session?.user){
      message("Liên kết mời chưa được xác thực hoặc đã hết hạn. Hãy mở lại email mời hoặc liên hệ Admin.");return;
    }
    history.replaceState(null,"",location.pathname);
    message("Đã xác minh tài khoản. Hãy nhập mật khẩu mới.",true);
    form.classList.remove("hide");
    form.addEventListener("submit",async event=>{
      event.preventDefault();
      const password=document.getElementById("new-password").value;
      const confirm=document.getElementById("confirm-password").value;
      if(password.length<12||password.length>128){message("Mật khẩu phải dài từ 12 đến 128 ký tự.");return}
      if(password!==confirm){message("Hai mật khẩu không khớp.");return}
      button.disabled=true;message("Đang lưu mật khẩu…");
      try{
        const {error:saveError}=await client.auth.updateUser({password});
        if(saveError)throw saveError;
        form.classList.add("hide");
        await client.auth.signOut();
        message("Đã thiết lập mật khẩu thành công. Hãy quay về trang đăng nhập.",true);
      }catch(err){
        message(err?.message||"Không lưu được mật khẩu. Vui lòng thử lại.");
      }finally{button.disabled=false}
    });
  }catch{
    message("Không xác minh được phiên đăng nhập. Vui lòng thử lại từ email mời.");
  }
})();
</script>
</body></html>
