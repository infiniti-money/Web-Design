<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Báo cáo hiệu suất | Tân Design</title><style>body{margin:0;background:#f5f6f2;color:#25372d;font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px}a{color:#256047}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #dbe4da;border-radius:8px;padding:20px;margin:14px 0}.metric{font-size:30px;font-weight:700}.bar{height:22px;background:#527963;margin:6px 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}button,select,input{padding:9px 12px;font:inherit;margin-right:8px}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style></head><body><main><a href="./admin.html">← Quản trị</a><h1>Báo cáo hiệu suất</h1><p id="notice" role="status">Đang kiểm tra quyền truy cập...</p><div id="report" hidden><label>Giai đoạn <select id="period"><option value="week">7 ngày gần nhất</option><option value="month">30 ngày gần nhất</option></select></label><button id="export">Xuất CSV tương thích Excel</button><div class="cards"><div class="card">Tổng công việc<div id="total" class="metric">0</div></div><div class="card">Hoàn thành<div id="done" class="metric">0</div></div><div class="card">Quá hạn<div id="late" class="metric">0</div></div></div><h2>Phân bố công việc theo trạng thái</h2><div id="bars"></div><h2>Công việc trong kỳ</h2><div style="overflow:auto"><table><thead><tr><th>Công việc</th><th>Trạng thái</th><th>Ngày tạo</th><th>Hạn</th></tr></thead><tbody id="rows"></tbody></table></div><p>Chỉ hiển thị dữ liệu được cấp quyền từ Supabase. Nội dung xuất CSV áp dụng cùng phạm vi phân quyền.</p></div></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script>
(async()=>{"use strict";const $=id=>document.getElementById(id),c=window.ATELIER_CONFIG;if(!c?.supabaseUrl||!c?.supabasePublishableKey||!window.supabase?.createClient){$("notice").textContent="Chưa kết nối được hệ thống.";return}const db=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);const {data:{user}}=await db.auth.getUser();if(!user){$("notice").textContent="Bạn cần đăng nhập Admin.";return}const {data:sp}=await db.from("staff_profiles").select("role,active").eq("user_id",user.id).single();if(!sp?.active||sp.role!==user.app_metadata?.role){$("notice").textContent="Không có quyền truy cập.";return}$("report").hidden=false;let rows=[];
async function load(){const days=$("period").value==="week"?7:30,since=new Date(Date.now()-days*86400000).toISOString();const {data,error}=await db.from("inquiry_care_tasks").select("id,title,status,due_at,completed_at,created_at,assignee_user_id").gte("created_at",since).order("created_at",{ascending:false}).limit(500);if(error){$("notice").textContent="Lỗi báo cáo: "+error.message;return}rows=data||[];const now=Date.now(),done=x=>x.completed_at||x.status==="completed",late=x=>!done(x)&&x.due_at&&new Date(x.due_at).getTime()<now;$("total").textContent=rows.length;$("done").textContent=rows.filter(done).length;$("late").textContent=rows.filter(late).length;$("notice").textContent="Báo cáo theo phạm vi tài khoản • "+(rows.length===500?"Tối đa 500 bản ghi trong lượt tải.":"Đã cập nhật");const bar=$("bars");bar.replaceChildren();for(const [label,predicate] of [["Hoàn thành",done],["Quá hạn",late],["Đang xử lý",x=>!done(x)&&!late(x)]]){const count=rows.filter(predicate).length,p=document.createElement("p");p.textContent=label+" — "+count;const x=document.createElement("div");x.className="bar";x.style.width=Math.max(1,100*count/Math.max(rows.length,1))+"%";bar.append(p,x)}$("rows").replaceChildren();for(const r of rows){const tr=document.createElement("tr");for(const t of [r.title,r.status,new Date(r.created_at).toLocaleDateString("vi-VN"),r.due_at?new Date(r.due_at).toLocaleDateString("vi-VN"):"—"]){const td=document.createElement("td");td.textContent=t;tr.append(td)}$("rows").append(tr)}}
$("period").onchange=load;$("export").onclick=()=>{const esc=x=>'"'+String(x??"").replace(/^[=+\-@\t\r]/,"'").replace(/"/g,'""')+'"';const content=[["Tên công việc","Trạng thái","Ngày tạo","Ngày hạn"],...rows.map(x=>[x.title,x.status,x.created_at,x.due_at])].map(line=>line.map(esc).join(",")).join("\r\n");const blob=new Blob(["\ufeff"+content],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="tan-design-bao-cao.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};await load();
})();
</script></body></html>
