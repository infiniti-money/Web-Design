<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản lý Catalog | Tân Design</title><style>body{margin:0;background:#f5f7f3;color:#25372b;font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}a{color:#28573d}h1{font:36px Georgia,serif}.card{padding:22px;background:white;border:1px solid #dde4da;border-radius:10px;margin:20px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{font:inherit;padding:11px;border:1px solid #b4c3b7;border-radius:5px;width:100%;box-sizing:border-box}textarea{min-height:90px}button{background:#28523a;color:white;border:0;padding:11px 15px;border-radius:5px;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5}.secondary{background:#e2e9e0;color:#26372b}.danger{background:#9b4343}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:15px;border:1px solid #e0e5df;padding:12px;border-radius:8px}.item img{width:85px;height:75px;object-fit:cover;background:#eee}.item div{flex:1}.muted{color:#637467;font-size:13px}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}}</style></head><body><main><a href="./admin.html">← Quản trị Tân Design</a><h1>Quản lý Catalog</h1><p class="muted">Chỉ Admin đang hoạt động được thêm, sửa, xóa hoặc xuất bản catalog. Dữ liệu nằm trong Supabase; không sử dụng tài khoản dịch vụ ở trình duyệt.</p><p id="status" role="status" aria-live="polite">Đang xác thực...</p><div id="workspace" class="hide"><div class="card"><h2>Thêm / chỉnh sửa mục</h2><form id="editor"><div class="grid"><div><label for="name">Tên mẫu *</label><input id="name" maxlength="140" minlength="2" required></div><div><label for="category">Danh mục *</label><select id="category"><option>Mẫu nội thất</option><option>Vật liệu</option><option>Thiết bị</option></select></div><div><label for="style">Phong cách</label><input id="style" maxlength="80" placeholder="Japandi, Hiện đại..."></div><div><label for="image">URL ảnh HTTPS</label><input id="image" type="url" placeholder="https://..."></div></div><label for="description">Mô tả</label><textarea id="description" maxlength="2000"></textarea><label for="sort">Thứ tự</label><input id="sort" type="number" value="0" step="1"><label><input id="published" type="checkbox" style="width:auto"> Công khai trên Catalog</label><div><button id="save" type="submit">Lưu mục Catalog</button><button id="reset" class="secondary" type="button">Tạo mới</button></div></form></div><div class="card"><h2>Danh sách Catalog</h2><div class="grid"><div><label for="search">Tìm kiếm</label><input id="search" placeholder="Tên hoặc mô tả"></div><div><label for="filter">Danh mục</label><select id="filter"><option value="">Tất cả</option><option>Mẫu nội thất</option><option>Vật liệu</option><option>Thiết bị</option></select></div></div><p id="count" class="muted"></p><div id="items" class="list"></div></div></div></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script>
(async()=>{"use strict";const $=id=>document.getElementById(id),cfg=window.ATELIER_CONFIG,client=window.supabase?.createClient?.(cfg?.supabaseUrl,cfg?.supabasePublishableKey);let rows=[],editing=null;
const notice=t=>$("status").textContent=t;
if(!client){notice("Không thể kết nối Supabase.");return}
const {data:{user},error}=await client.auth.getUser();if(error||!user){notice("Bạn cần đăng nhập Admin trước.");return}
const {data:staff,error:staffError}=await client.from("staff_profiles").select("role,active").eq("user_id",user.id).single();
if(staffError||!staff?.active||staff.role!=="admin"||user.app_metadata?.role!=="admin"){notice("Tài khoản không có quyền quản lý Catalog.");return}
$("workspace").classList.remove("hide");
async function refresh(){const {data,error}=await client.from("catalog_items").select("id,name,category,style,description,image_url,published,sort_order").order("sort_order").limit(500);if(error){notice("Lỗi tải Catalog: "+error.message);return}rows=data||[];render();notice("Đã tải "+rows.length+" mục.")}
function render(){const key=$("search").value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(),cat=$("filter").value,list=rows.filter(r=>(!cat||r.category===cat)&&(!key||(r.name+" "+r.description).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(key)));$("items").replaceChildren();$("count").textContent=list.length+" / "+rows.length+" mục";for(const r of list){const row=document.createElement("article");row.className="item";if(r.image_url){const img=document.createElement("img");img.src=r.image_url;img.loading="lazy";img.alt="Ảnh mẫu";row.append(img)}const box=document.createElement("div");const strong=document.createElement("strong");strong.textContent=r.name;const meta=document.createElement("p");meta.className="muted";meta.textContent=r.category+" · "+(r.style||"Chưa phân loại")+" · "+(r.published?"Công khai":"Bản nháp");box.append(strong,meta);row.append(box);const edit=document.createElement("button");edit.textContent="Sửa";edit.className="secondary";edit.onclick=()=>{editing=r.id;for(const [id,value] of Object.entries({name:r.name,category:r.category,style:r.style,description:r.description,image:r.image_url,sort:r.sort_order}))$(id).value=value;$("published").checked=r.published;window.scrollTo(0,0)};const del=document.createElement("button");del.textContent="Xóa";del.className="danger";del.onclick=async()=>{if(!confirm("Xóa mục "+r.name+"?"))return;const {error}=await client.from("catalog_items").delete().eq("id",r.id).select("id").single();if(error)notice("Không thể xóa: "+error.message);else{if(editing===r.id)reset();await refresh()}};row.append(edit,del);$("items").append(row)}}
function reset(){editing=null;$("editor").reset();$("sort").value="0";$("published").checked=false}
$("reset").onclick=reset;$("search").oninput=render;$("filter").onchange=render;
$("editor").onsubmit=async event=>{event.preventDefault();$("save").disabled=true;const item={name:$("name").value.trim(),category:$("category").value,style:$("style").value.trim(),description:$("description").value.trim(),image_url:$("image").value.trim(),sort_order:Number($("sort").value),published:$("published").checked};
if(item.name.length<2||!Number.isSafeInteger(item.sort_order)||item.image_url&&!/^https:\/\/[^\s]+$/.test(item.image_url)){notice("Thông tin không hợp lệ.");$("save").disabled=false;return}
const query=editing?client.from("catalog_items").update(item).eq("id",editing):client.from("catalog_items").insert(item);
const {error}=await query.select("id").single();$("save").disabled=false;if(error){notice("Không lưu được: "+error.message);return}reset();await refresh()};
await refresh();
})();
</script></body></html>
