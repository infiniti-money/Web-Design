<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản lý Catalog | ATELIER HOME</title><style>body{margin:0;background:#f5f7f3;color:#25372b;font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}a{color:#28573d}h1{font:36px Georgia,serif}.card{padding:22px;background:white;border:1px solid #dde4da;border-radius:10px;margin:20px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{font:inherit;padding:11px;border:1px solid #b4c3b7;border-radius:5px;width:100%;box-sizing:border-box}textarea{min-height:90px}button{background:#28523a;color:white;border:0;padding:11px 15px;border-radius:5px;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5}.secondary{background:#e2e9e0;color:#26372b}.danger{background:#9b4343}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:15px;border:1px solid #e0e5df;padding:12px;border-radius:8px}.item img{width:85px;height:75px;object-fit:cover;background:#eee}.item div{flex:1}.muted{color:#637467;font-size:13px}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}}</style><link rel="stylesheet" href="./assets/admin-workspace.css"></head><body><main><a href="./admin.html">← Quản trị ATELIER HOME</a><h1>Quản lý Catalog</h1><p class="muted">Chỉ Admin đang hoạt động được sửa/xuất bản Catalog. Bản nháp không hiển thị với khách; trước khi công khai cần xác minh mô tả, hình ảnh và quyền sử dụng. <a href="./catalog.html" target="_blank" rel="noopener noreferrer">Xem Catalog công khai</a>.</p><p id="status" role="status" aria-live="polite">Đang xác thực...</p><div id="workspace" class="hide"><div class="card"><h2>Thêm / chỉnh sửa mục</h2><form id="editor"><div class="grid"><div><label for="name">Tên mẫu *</label><input id="name" maxlength="140" minlength="2" required></div><div><label for="category">Danh mục *</label><select id="category"><option>Mẫu nội thất</option><option>Vật liệu</option><option>Thiết bị</option></select></div><div><label for="style">Phong cách</label><input id="style" maxlength="80" placeholder="Japandi, Hiện đại..."></div><div><label for="image">URL ảnh HTTPS</label><input id="image" type="url" placeholder="https://..."></div></div><label for="description">Mô tả</label><textarea id="description" maxlength="2000"></textarea><label for="sort">Thứ tự</label><input id="sort" type="number" value="0" step="1"><label><input id="published" type="checkbox" style="width:auto"> Công khai trên Catalog</label><div><button id="save" type="submit">Lưu mục Catalog</button><button id="reset" class="secondary" type="button">Tạo mới</button></div></form></div><div class="card"><h2>Danh sách Catalog</h2><div class="grid"><div><label for="search">Tìm kiếm</label><input id="search" type="search" maxlength="120" placeholder="Tên, mô tả, phong cách"></div><div><label for="filter">Danh mục</label><select id="filter"><option value="">Tất cả</option><option>Mẫu nội thất</option><option>Vật liệu</option><option>Thiết bị</option></select></div><div><label for="visibility">Trạng thái</label><select id="visibility"><option value="all">Tất cả</option><option value="published">Đã công khai</option><option value="draft">Bản nháp</option></select></div><div><label>&nbsp;</label><button id="catalog-reload" type="button" class="secondary">Làm mới danh sách</button></div></div><p id="count" class="muted"></p><div id="items" class="list"></div></div></div></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="./assets/admin-workspace.js"></script><script>
(async()=>{"use strict";const $=id=>document.getElementById(id),cfg=window.ATELIER_CONFIG,client=window.supabase?.createClient?.(cfg?.supabaseUrl,cfg?.supabasePublishableKey,window.ATELIER_CLIENT_OPTIONS||{});let rows=[],editing=null,dirty=false,busy=false;
const notice=t=>$("status").textContent=t;
if(!client){notice("Không thể kết nối Supabase.");return}
const {data:{user},error}=await client.auth.getUser();if(error||!user){notice("Bạn cần đăng nhập Admin trước.");return}
const {data:staff,error:staffError}=await client.from("staff_profiles").select("role,active").eq("user_id",user.id).single();
if(staffError||!staff?.active||staff.role!=="admin"||user.app_metadata?.role!=="admin"){notice("Tài khoản không có quyền quản lý Catalog.");return}
$("workspace").classList.remove("hide");
async function refresh(){notice("Đang cập nhật danh sách Catalog…");try{const {data,error}=await client.from("catalog_items").select("id,name,category,style,description,image_url,published,sort_order").order("sort_order").limit(500);if(error)throw error;rows=data||[];render();notice("Đã tải "+rows.length+" mục.")}catch{rows=[];render();notice("Không tải được Catalog. Danh sách cũ đã ẩn để tránh nhầm; vui lòng tải lại.")}}
function render(){
const normalize=value=>String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();
const key=normalize($("search").value).trim(),cat=$("filter").value,visibility=$("visibility").value;
const list=rows.filter(r=>(!cat||r.category===cat)&&(visibility==="all"||(visibility==="published")===!!r.published)&&(!key||normalize([r.name,r.style,r.description].join(" ")).includes(key)));
$("items").replaceChildren();$("count").textContent=list.length+" / "+rows.length+" mục đã tải"+(rows.length>=500?" (giới hạn 500, có thể còn dữ liệu khác)":"");
if(!list.length){const empty=document.createElement("p");empty.className="muted";empty.textContent="Không có mục Catalog phù hợp bộ lọc."; $("items").append(empty);}
for(const r of list){
 const row=document.createElement("article");row.className="item";
 if(r.image_url && /^https:\/\//i.test(r.image_url)){const img=document.createElement("img");img.src=r.image_url;img.loading="lazy";img.alt="Ảnh mẫu "+r.name;row.append(img);}
 const box=document.createElement("div"),strong=document.createElement("strong"),meta=document.createElement("p");
 strong.textContent=r.name;meta.className="muted";meta.textContent=r.category+" · "+(r.style||"Chưa phân loại")+" · "+(r.published?"Công khai":"Bản nháp");box.append(strong,meta);row.append(box);
 const edit=document.createElement("button");edit.type="button";edit.textContent="Sửa";edit.className="secondary";
 edit.onclick=()=>{if(busy||dirty&&!confirm("Bạn có thay đổi Catalog chưa lưu. Bỏ thay đổi để mở mục khác?"))return;
 editing=r.id;dirty=false;for(const [id,value] of Object.entries({name:r.name,category:r.category,style:r.style,description:r.description,image:r.image_url,sort:r.sort_order}))$(id).value=value??"";
 $("published").checked=!!r.published;notice("Đang sửa: "+r.name);$("save").textContent="Lưu thay đổi";$("editor").scrollIntoView({behavior:"smooth",block:"start"});};
 const del=document.createElement("button");del.type="button";del.textContent="Xóa";del.className="danger";
 del.onclick=async()=>{if(busy||!confirm("Xóa vĩnh viễn "+r.name+(r.published?" đang công khai":"")+"? Không thể hoàn tác."))return;
 busy=true;del.disabled=true;try{const {data,error}=await client.from("catalog_items").delete().eq("id",r.id).select("id").single();
 if(error||!data?.id)throw error||new Error("No confirmed row");if(editing===r.id)reset(true);
 await refresh();notice("Đã xóa mục Catalog.");}catch{notice("Chưa xác nhận được việc xóa. Kiểm tra quyền và thử lại.");}finally{busy=false;del.disabled=false;}};
 row.append(edit,del);$("items").append(row);
}}

function reset(force=false){if(busy&&!force)return;if(!force&&dirty&&!confirm("Bỏ các thay đổi Catalog chưa lưu?"))return;editing=null;dirty=false;$("editor").reset();$("sort").value="0";$("published").checked=false;$("save").textContent="Lưu mục Catalog"}
$("reset").onclick=()=>reset();$("search").oninput=render;$("filter").onchange=render;$("visibility").onchange=render;$("catalog-reload").onclick=refresh;$("editor").addEventListener("input",()=>dirty=true);$("editor").addEventListener("change",()=>dirty=true);window.addEventListener("beforeunload",e=>{if(dirty||busy){e.preventDefault();e.returnValue="";}});
$("editor").onsubmit=async event=>{
event.preventDefault();if(busy||!$("editor").reportValidity())return;
const item={name:$("name").value.trim(),category:$("category").value,style:$("style").value.trim(),description:$("description").value.trim(),image_url:$("image").value.trim(),sort_order:Number($("sort").value),published:$("published").checked};
let validUrl=true;if(item.image_url){try{const url=new URL(item.image_url);validUrl=url.protocol==="https:"&&!url.username&&!url.password&&!!url.hostname&&!/[\s<>"']/.test(item.image_url);}catch{validUrl=false;}}
if(item.name.length<2||!Number.isSafeInteger(item.sort_order)||item.sort_order< -99999||item.sort_order>99999||!validUrl){notice("Tên, thứ tự hoặc URL ảnh HTTPS không hợp lệ.");return;}
const previous=editing?rows.find(r=>r.id===editing):null;
if(item.published&&!previous?.published&&!confirm("Xác nhận hình ảnh có quyền sử dụng, nội dung đã kiểm tra và muốn công khai mục này?"))return;
busy=true;$("save").disabled=true;
try{const query=editing?client.from("catalog_items").update(item).eq("id",editing):client.from("catalog_items").insert(item);
const {data,error}=await query.select("id").single();if(error||!data?.id)throw error||new Error("Unconfirmed write");
reset(true);await refresh();notice("Đã lưu mục Catalog.");
}catch{notice("Chưa lưu được mục Catalog. Nội dung nhập được giữ nguyên để kiểm tra và thử lại.");}
finally{busy=false;$("save").disabled=false;}
};

await refresh();
})();
</script></body></html>
