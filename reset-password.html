<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Khôi phục mật khẩu | Tân Design</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f5f1;color:#22312b;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}main{background:#fff;border-radius:16px;border:1px solid #dce5dc;padding:30px;width:min(100%,450px);box-sizing:border-box}label{display:block;margin:18px 0 7px}input,button{width:100%;box-sizing:border-box;padding:12px;font:inherit;border-radius:8px}input{border:1px solid #98aaa0}button{border:0;background:#264f39;color:#fff;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}.hide{display:none}#status{min-height:32px;color:#963535;line-height:1.5}.ok{color:#14653a!important}a{color:#235b3c}</style>
</head><body><main><h1>Khôi phục mật khẩu</h1><p id="intro">Nhập email tài khoản Tân Design để nhận liên kết đặt lại mật khẩu.</p>
<form id="request-form"><label for="email">Email tài khoản</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button id="send" type="submit">Gửi liên kết khôi phục</button></form>
<form id="reset-form" class="hide"><label for="password">Mật khẩu mới</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Xác nhận mật khẩu</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save" type="submit">Đổi mật khẩu</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="./admin.html">Quay về đăng nhập</a></p></main>
<script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script>
(async()=>{
"use strict";
const $=id=>document.getElementById(id),status=$("status"),request=$("request-form"),reset=$("reset-form");
const q=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const callback=hash.get("type")==="recovery"||q.has("code")||hash.has("error")||q.has("error");
function msg(v,ok=false){status.textContent=v;status.classList.toggle("ok",ok)}
const cfg=window.ATELIER_CONFIG;
if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey||!window.supabase?.createClient){msg("Không kết nối được hệ thống xác thực.");request.classList.add("hide");return;}
const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
if(callback){
 request.classList.add("hide");
 if(hash.has("error")||q.has("error")){msg("Liên kết không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu liên kết mới.");return}
 try{
  const {data,error}=await client.auth.getSession();
  if(error||!data.session?.user){msg("Liên kết đã hết hạn hoặc phiên xác thực không hợp lệ. Hãy yêu cầu liên kết mới.");return}
  history.replaceState(null,"",location.pathname);
  $("intro").textContent="Hãy đặt mật khẩu mới cho tài khoản của bạn.";
  reset.classList.remove("hide");
 }catch{msg("Không thể xác minh liên kết. Vui lòng yêu cầu liên kết mới.");return}
}
request.addEventListener("submit",async event=>{
 event.preventDefault();$("send").disabled=true;msg("Đang gửi yêu cầu…");
 try{
  const redirectTo=new URL("reset-password.html",location.href).origin+new URL("reset-password.html",location.href).pathname;
  await client.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo});
  // Always generic to avoid leaking account existence
  msg("Nếu email có tài khoản hợp lệ, bạn sẽ nhận được hướng dẫn khôi phục. Hãy kiểm tra cả thư rác.",true);
 }catch{msg("Không thể xử lý yêu cầu lúc này. Vui lòng thử lại sau.");}
 finally{$("send").disabled=false}
});
reset.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=$("password").value;
 if(password!==$("confirm").value){msg("Mật khẩu xác nhận không khớp.");return}
 if(password.length<12||password.length>128){msg("Mật khẩu cần từ 12 đến 128 ký tự.");return}
 $("save").disabled=true;msg("Đang cập nhật mật khẩu…");
 try{
  const {error}=await client.auth.updateUser({password});
  if(error)throw error;
  reset.classList.add("hide");
  await client.auth.signOut();
  msg("Đã cập nhật mật khẩu. Bạn có thể quay lại đăng nhập.",true);
 }catch(err){msg("Không thể đổi mật khẩu: "+(err?.message||"Vui lòng thử lại."))}
 finally{$("save").disabled=false}
});
})();
</script></body></html>
