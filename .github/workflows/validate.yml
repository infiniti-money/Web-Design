name: Validate ATELIER HOME

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated project HTML and sitemap
        run: node scripts/build-project-pages.cjs --check
      - name: Run website and security tests
        run: node --test tests/*.test.cjs
