name: Validate ATELIER HOME

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated project HTML and sitemap
        run: node scripts/build-project-pages.cjs --check
      - name: Run website and security tests
        run: node --test tests/*.test.cjs
      - name: Check Windows protocol and packaged route allowlist
        run: node --test desktop/test/security.test.cjs

  quote-history-postgres:
    name: PostgreSQL 17 quote history immutability
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: quote_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d quote_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL isolated trigger regression (no production credentials)
        env:
          PGPASSWORD: isolated-ci-only
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql -h 127.0.0.1 -U ci -d quote_guard_test -v ON_ERROR_STOP=1 -f tests/quote-version-guard-isolated.sql
      - name: Verify current project roles and revoked JWTs on isolated PostgreSQL
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h 127.0.0.1 -U ci -d quote_guard_test -v ON_ERROR_STOP=1 -f tests/projects-authoritative-rls-isolated.sql



  consultation-browser:
    name: Public consultation UX (isolated Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright --version
      - name: Start isolated preview (no production writes)
        run: |
          node scripts/serve-local.cjs > /tmp/atelier-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atelier-preview.log
          exit 1
      - name: Test service selection, error handling and receipt confirmation
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/consultation-browser-smoke.cjs
      - name: Verify CMS roles, approvals, revisions and quote UI with fixtures
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/cms-browser-smoke.cjs
      - name: Verify Catalog role, filters and safe publish with fixtures
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/catalog-browser-smoke.cjs
      - name: Verify delivery admin/manager/employee and synthetic create
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/delivery-browser-smoke.cjs
      - name: Verify opt-in chat loader without contacting the provider
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/customer-chat-browser.cjs
