name: Delivery workspace staging security tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/delivery-workspaces-staging.sql'
      - 'tests/delivery-rls-isolated.sql'
      - '.github/workflows/delivery-rls.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d delivery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client when missing
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Test RLS and relational constraints with synthetic isolated data
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h 127.0.0.1 -U ci -d delivery_test -v ON_ERROR_STOP=1 -f tests/delivery-rls-isolated.sql
