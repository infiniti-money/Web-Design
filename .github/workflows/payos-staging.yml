name: Isolated payOS ledger and SDK checks
on:
  push:
    branches: [main]
    paths: ['supabase/payos-deposits-staging.sql', 'supabase/functions/**', 'tests/payos*', '.github/workflows/payos-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: payos_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci -d payos_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated ledger and RLS (no production credentials)
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h 127.0.0.1 -U ci -d payos_test -v ON_ERROR_STOP=1 -f tests/payos-ledger-isolated.sql
      - name: Core default-off, auth, amount, idempotency and callback rules
        run: node --test tests/payos-core.test.cjs
      - name: Install pinned official SDK (test credentials only)
        run: npm install --prefix dist/payos-sdk --no-package-lock --ignore-scripts @payos/node@2.0.5
      - name: Verify official SDK signature and tampered receipt handling
        run: node tests/payos-sdk-check.cjs
      - name: Review workflow and pilot policy on isolated PostgreSQL
        env:
          PGPASSWORD: isolated-ci-only
        run: |
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE payos_reconciliation_test'
          psql -h 127.0.0.1 -U ci -d payos_reconciliation_test -v ON_ERROR_STOP=1 -f tests/payos-reconciliation-isolated.sql
      - name: HTTP, official SDK and PostgreSQL reconciliation with concurrent callbacks
        env:
          PGHOST: 127.0.0.1
          PGUSER: ci
          PGPASSWORD: isolated-ci-only
          PGDATABASE: payos_e2e_test
          PAYOS_TEST_ISOLATED: '1'
        run: |
          psql -h 127.0.0.1 -U ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE payos_e2e_test'
          node tests/payos-http-ledger.cjs
      - name: Upload synthetic reconciliation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payos-http-ledger-results
          path: dist/payos-uat/*.json
          if-no-files-found: ignore
