name: Release ATELIER HOME website
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and notes
        run: |
          node -e 'const m=require("./website-release.json");if(process.env.GITHUB_REF_TYPE==="tag"&&process.env.GITHUB_REF_NAME!=="v"+m.version)throw Error("Tag must match website-release.json");'
      - name: Validate website
        run: |
          node scripts/build-project-pages.cjs --check
          node --test tests/*.test.cjs
      - name: Package exact committed source
        run: |
          node scripts/package-release.cjs
          unzip -t dist/web-release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-home-website-source
          path: dist/web-release/
          if-no-files-found: error
      - name: Publish immutable website release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./website-release.json").version')
          NOTES=$(node -p 'require("./website-release.json").notes')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Published release remains unchanged."
          else
            gh release create "$GITHUB_REF_NAME" dist/web-release/* --verify-tag --title "ATELIER HOME web $VERSION" --notes-file "$NOTES" --latest=false
          fi

