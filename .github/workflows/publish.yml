name: Publish ATELIER HOME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-atelier-home"
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release v1.2.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify source
        run: |
          node --test tests/static.test.cjs
      - name: Package v1.2.0
        run: |
          mkdir -p dist/atelier-home-v1.2.0/supabase/functions/submit-inquiry
          cp index.html admin.html admin.js app-config.js site-backend.js README.md SUPABASE_SETUP.md RELEASE_NOTES_V1_2.md dist/atelier-home-v1.2.0/
          cp supabase/schema.sql supabase/inquiry-rate-limit.sql dist/atelier-home-v1.2.0/supabase/
          cp supabase/functions/submit-inquiry/index.ts dist/atelier-home-v1.2.0/supabase/functions/submit-inquiry/
          cd dist
          zip -qr atelier-home-v1.2.0.zip atelier-home-v1.2.0
      - name: Create Release if not yet published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Existing v1.2.0 release remains unchanged."
          else
            gh release create v1.2.0 ./dist/atelier-home-v1.2.0.zip \
              --target "$GITHUB_SHA" \
              --title "ATELIER HOME v1.2.0 — Secure Inquiries" \
              --notes-file RELEASE_NOTES_V1_2.md
          fi

