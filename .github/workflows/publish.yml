name: Publish ATELIER HOME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-atelier-home"
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release v1.6.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify source
        run: |
          node --test tests/static.test.cjs tests/email-notification.test.cjs
      - name: Package v1.6.0
        run: |
          mkdir -p dist/atelier-home-v1.6.0/supabase/functions/submit-inquiry
          cp index.html admin.html admin.js app-config.js site-backend.js privacy.html README.md SUPABASE_SETUP.md TURNSTILE_SETUP.md EMAIL_NOTIFICATIONS_SETUP.md RELEASE_NOTES_V1_6_0.md dist/atelier-home-v1.6.0/
          cp supabase/schema.sql supabase/inquiry-rate-limit.sql supabase/privacy-consent.sql supabase/inquiry-retention-12m.sql supabase/admin-contact-rpc.sql supabase/customer-care-v1_6.sql supabase/customer-care-audit-v1_6.sql dist/atelier-home-v1.6.0/supabase/
          cp supabase/functions/submit-inquiry/index.ts dist/atelier-home-v1.6.0/supabase/functions/submit-inquiry/
          cd dist
          zip -qr atelier-home-v1.6.0.zip atelier-home-v1.6.0
      - name: Create Release if not yet published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.6.0 >/dev/null 2>&1; then
            echo "Existing v1.6.0 release remains unchanged."
          else
            gh release create v1.6.0 ./dist/atelier-home-v1.6.0.zip \
              --target "$GITHUB_SHA" \
              --title "ATELIER HOME v1.6.0 — Customer Care and In-App Follow-Ups" \
              --notes-file RELEASE_NOTES_V1_6_0.md
          fi

