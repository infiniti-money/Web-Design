name: Publish ATELIER HOME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-atelier-home"
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release v1.3.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify source
        run: |
          node --test tests/static.test.cjs
      - name: Package v1.3.4
        run: |
          mkdir -p dist/atelier-home-v1.3.4/supabase/functions/submit-inquiry
          cp index.html admin.html admin.js app-config.js site-backend.js privacy.html README.md SUPABASE_SETUP.md TURNSTILE_SETUP.md RELEASE_NOTES_V1_3_4.md dist/atelier-home-v1.3.4/
          cp supabase/schema.sql supabase/inquiry-rate-limit.sql supabase/privacy-consent.sql supabase/inquiry-retention-12m.sql supabase/admin-contact-rpc.sql dist/atelier-home-v1.3.4/supabase/
          cp supabase/functions/submit-inquiry/index.ts dist/atelier-home-v1.3.4/supabase/functions/submit-inquiry/
          cd dist
          zip -qr atelier-home-v1.3.4.zip atelier-home-v1.3.4
      - name: Create Release if not yet published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.4 >/dev/null 2>&1; then
            echo "Existing v1.3.4 release remains unchanged."
          else
            gh release create v1.3.4 ./dist/atelier-home-v1.3.4.zip \
              --target "$GITHUB_SHA" \
              --title "ATELIER HOME v1.3.4 — Server-Timed Contact Acknowledgement" \
              --notes-file RELEASE_NOTES_V1_3_4.md
          fi

