name: Browser smoke test (deployed site)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-smoke.yml']
  workflow_run:
    workflows: ["Deploy ATELIER HOME to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright --version
      - name: Check deployed homepage, Supabase requests and admin login
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/browser-smoke.cjs
      - name: Check CMS, permissions and quotation UI with synthetic fixtures
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/cms-browser-smoke.cjs
      - name: Check static knowledge without JavaScript
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/knowledge-browser.cjs
      - name: Check published knowledge search and article navigation
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/knowledge-discovery-browser.cjs
      - name: Check operations hub RBAC/counts using synthetic browser fixtures
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/operations-browser-smoke.cjs
      - name: Check consultation resilience using synthetic responses
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/consultation-browser-smoke.cjs
      - name: Check Catalog admin role, filters and publish with synthetic fixtures
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/catalog-browser-smoke.cjs
      - name: Check homepage font, keyboard and contact fallbacks
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/home-experience.cjs
      - name: Check consultation recovery with synthetic requests
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/consultation-browser.cjs
      - name: Check delivery authorization and synthetic CRUD after deployment
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/delivery-browser-smoke.cjs
      - name: Check public Catalog links, filters and recovery
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/catalog-public-browser.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-site-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
