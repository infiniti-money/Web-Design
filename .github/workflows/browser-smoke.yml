name: Browser smoke test (deployed site)

on:
  workflow_run:
    workflows: ["Publish ATELIER HOME"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check deployed homepage, Supabase requests and admin login
        env:
          SITE_URL: https://infiniti-money.github.io/Web-Design/
        run: node tests/browser-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-site-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
