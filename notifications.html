<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Thông báo nội bộ — Tân Design</title><style>body{margin:0;background:#f4f6f2;color:#263b2d;font:15px/1.6 system-ui,sans-serif}main{max-width:850px;margin:30px auto;padding:20px}.card{background:white;border:1px solid #dce5dd;border-radius:10px;padding:22px;margin:12px 0}h1{font:36px Georgia,serif}button{background:#28543c;color:white;border:0;border-radius:5px;padding:9px 15px;cursor:pointer}.muted{color:#607267;font-size:13px}.new{border-left:5px solid #548466}a{color:#286043}</style></head><body><main><a href="./admin.html">← Quay lại Admin</a><h1>Trung tâm thông báo</h1><p class="muted">Thông báo cá nhân về công việc được giao. Chỉ tài khoản nhân viên còn hoạt động được xem hộp thư của mình.</p><button id="refresh">Làm mới</button><p id="status" role="status" aria-live="polite"></p><section id="messages" aria-label="Danh sách thông báo"></section></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script>
(async()=>{"use strict";const $=id=>document.getElementById(id),cfg=window.ATELIER_CONFIG;if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey||!window.supabase?.createClient){$("status").textContent="Không thể kết nối xác thực.";return}
const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const {data:{user},error}=await client.auth.getUser();if(error||!user){$("status").textContent="Vui lòng đăng nhập trước.";return}
const {data:sp}=await client.from("staff_profiles").select("role,active").eq("user_id",user.id).single();if(!sp?.active||sp.role!==user.app_metadata?.role){$("status").textContent="Tài khoản không có quyền xem thông báo.";return}
async function load(){const {data,error}=await client.from("staff_notifications").select("id,title,body,kind,created_at,read_at").eq("recipient_id",user.id).order("created_at",{ascending:false}).limit(100);const host=$("messages");host.replaceChildren();if(error){$("status").textContent="Không tải được thông báo: "+error.message;return}$("status").textContent=(data||[]).filter(x=>!x.read_at).length+" thông báo chưa đọc";for(const item of data||[]){const card=document.createElement("article");card.className="card"+(!item.read_at?" new":"");const heading=document.createElement("strong");heading.textContent=item.title;const p=document.createElement("p");p.textContent=item.body;const date=document.createElement("p");date.className="muted";date.textContent=new Date(item.created_at).toLocaleString("vi-VN");card.append(heading,p,date);if(!item.read_at){const btn=document.createElement("button");btn.textContent="Đánh dấu đã đọc";btn.onclick=async()=>{btn.disabled=true;const {error}=await client.from("staff_notifications").update({read_at:new Date().toISOString()}).eq("id",item.id).eq("recipient_id",user.id);if(error){$("status").textContent="Không thể đánh dấu đã đọc.";btn.disabled=false}else await load()};card.append(btn)}host.append(card)}if(!data?.length){$("status").textContent="Chưa có thông báo."}}
$("refresh").onclick=load;await load();
})();
</script></body></html>
