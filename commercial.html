<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Báo giá & hợp đồng — Tân Design</title><style>body{font:15px/1.6 system-ui,sans-serif;background:#f4f6f2;color:#253b2d;margin:0}main{max-width:1100px;margin:auto;padding:28px}h1{font:38px/1.3 system-ui,"Segoe UI",Arial,sans-serif}.panel{background:white;border:1px solid #dce4d9;padding:20px;margin:16px 0;border-radius:10px}input,select,textarea,button{font:inherit;padding:9px;margin:5px;max-width:100%}button{background:#29583b;color:white;border:0;border-radius:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border-bottom:1px solid #ddd;padding:12px 0}.muted{color:#647368}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./admin.html">← Quản trị Tân Design</a><h1>Báo giá và hợp đồng</h1><p id="status" role="status">Đang xác thực...</p><div id="app" hidden><div class="grid"><section class="panel"><h2>Tạo báo giá</h2><label>Khách hàng <select id="quote-inquiry"></select></label><label>Tiêu đề <input id="quote-title" maxlength="180" placeholder="Báo giá thiết kế nội thất"></label><button id="create-quote">Tạo báo giá nháp</button><h2>Danh sách báo giá</h2><div id="quotes"></div></section><section class="panel"><h2>Tạo hợp đồng</h2><label>Khách hàng <select id="contract-inquiry"></select></label><label>Số hợp đồng <input id="contract-number" maxlength="90"></label><label>Báo giá đã được khách chấp nhận <select id="contract-quote"></select></label><button id="create-contract">Tạo hợp đồng nháp</button><h2>Danh sách hợp đồng</h2><div id="contracts"></div></section></div><section class="panel"><h2>Lịch sử phê duyệt và thay đổi</h2><div id="audit"></div></section></div></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script>
(async()=>{"use strict";const $=x=>document.getElementById(x),config=window.ATELIER_CONFIG;if(!config?.supabaseUrl||!config?.supabasePublishableKey||!window.supabase?.createClient){$("status").textContent="Kết nối chưa sẵn sàng";return}const db=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);let user,sp;try{const auth=await db.auth.getUser();user=auth.data?.user;if(auth.error||!user){$("status").textContent="Vui lòng đăng nhập tại trang Quản trị rồi mở lại mục này.";return}const profile=await db.from("staff_profiles").select("role,active").eq("user_id",user.id).single();if(profile.error){$("status").textContent="Không xác minh được quyền truy cập. Vui lòng đăng nhập lại.";return}sp=profile.data;}catch(error){$("status").textContent="Kết nối xác thực thất bại. Kiểm tra mạng và thử lại.";return}if(!sp?.active||!["admin","manager"].includes(sp.role)||sp.role!==user.app_metadata?.role){$("status").textContent="Bạn không có quyền truy cập";return}$("app").hidden=false;const alert=t=>$("status").textContent=t;
let submitting=false;async function action(kind,step,id,extra={}){if(submitting)return;submitting=true;alert("Đang xử lý thao tác...");try{const {error}=await db.rpc("commercial_action",{p_kind:kind,p_action:step,p_id:id||null,p_inquiry:extra.inquiry||null,p_title:extra.title||null,p_amount:extra.amount??null,p_content:extra.content||null});if(error){alert("Không thực hiện được: "+error.message);return}const refreshed=await load();alert(refreshed?"Đã lưu thao tác: "+step:"Đã lưu thao tác, nhưng chưa tải lại được dữ liệu. Vui lòng làm mới trang.")}catch(error){alert("Lỗi xử lý: "+(error.message||"Không xác định"))}finally{submitting=false}}
const quoteNames={draft:"Nháp",submitted:"Chờ duyệt",approved:"Đã duyệt",rejected:"Đã từ chối",sent:"Đã gửi khách",accepted:"Khách đã chấp nhận"};const contractNames={draft:"Nháp",review:"Chờ xem xét",signed:"Đã ký",active:"Đang thực hiện",completed:"Hoàn thành",cancelled:"Đã hủy"};
function button(label,callback){const b=document.createElement("button");b.textContent=label;b.onclick=callback;return b}
function line(container,title,description,actions){const el=document.createElement("div");el.className="item";const heading=document.createElement("strong");heading.textContent=title;const p=document.createElement("p");p.className="muted";p.textContent=description;el.append(heading,p);actions.forEach(([name,cb])=>el.append(button(name,cb)));container.append(el)}
async function load(){const previousChoices=new Map(["quote-inquiry","contract-inquiry"].map(id=>[id,$(id).value]));const requests=await Promise.all([db.from("inquiries").select("id,full_name").limit(200),db.from("customer_quotes").select("id,title,status,inquiry_id").order("created_at",{ascending:false}).limit(200),db.from("customer_contracts").select("id,contract_number,status,inquiry_id").order("created_at",{ascending:false}).limit(200),db.from("commercial_audit").select("action,entity_kind,actor_id,details,created_at").order("created_at",{ascending:false}).limit(50),db.from("customer_quote_versions").select("quote_id,version_no,total_amount").order("version_no",{ascending:false}).limit(200),db.from("staff_profiles").select("user_id,full_name").limit(200)]);if(requests.some(x=>x.error)){alert("Không tải được dữ liệu báo giá/hợp đồng. Kiểm tra kết nối hoặc quyền truy cập.");return false}const [inquiries,quotes,contracts,audit,versions,staff]=requests.map(x=>x.data||[]);
const versionByQuote=new Map();for(const v of versions)if(!versionByQuote.has(v.quote_id))versionByQuote.set(v.quote_id,v);
const staffName=new Map(staff.map(p=>[p.user_id,p.full_name]));
const actionName={create:"Tạo",revise:"Sửa phiên bản",submit:"Trình duyệt",approve:"Phê duyệt",reject:"Từ chối",send:"Gửi khách",accept:"Ghi nhận khách chấp nhận",review:"Trình xem xét",sign:"Xác nhận ký",activate:"Kích hoạt",complete:"Hoàn thành"};for(const id of ["quote-inquiry","contract-inquiry"]){const select=$(id);select.replaceChildren();for(const i of inquiries){const option=document.createElement("option");option.value=i.id;option.textContent=i.full_name;select.append(option)}if(inquiries.some(i=>i.id===previousChoices.get(id)))select.value=previousChoices.get(id)}const accepted=quotes.filter(q=>q.status==="accepted");function refreshContractQuoteOptions(){const quoteSel=$("contract-quote"),existing=quoteSel.value;quoteSel.replaceChildren();const relevant=accepted.filter(q=>q.inquiry_id===$("contract-inquiry").value);for(const q of relevant){const opt=document.createElement("option");opt.value=q.id;opt.textContent=q.title;quoteSel.append(opt)}if(relevant.some(q=>q.id===existing))quoteSel.value=existing;}$("contract-inquiry").onchange=refreshContractQuoteOptions;refreshContractQuoteOptions();const q=$("quotes");q.replaceChildren();for(const r of quotes){const actions=[];if(["draft","rejected"].includes(r.status)){actions.push(["Thêm phiên bản",()=>{const amount=prompt("Tổng tiền VND");if(amount===null)return;const n=Number(amount);if(!Number.isFinite(n)||n<0)return alert("Số tiền không hợp lệ");const description=prompt("Nội dung báo giá (diễn giải)");if(description===null)return;action("quote","revise",r.id,{amount:n,content:{description}})}],["Trình duyệt",()=>action("quote","submit",r.id)])}if(r.status==="submitted"&&sp.role==="admin")actions.push(["Duyệt",()=>action("quote","approve",r.id)],["Từ chối",()=>{const reason=prompt("Lý do từ chối báo giá (ít nhất 5 ký tự):");if(reason===null)return;if(reason.trim().length<5||reason.trim().length>1000)return alert("Nhập lý do từ 5 đến 1000 ký tự.");action("quote","reject",r.id,{content:{reason:reason.trim()}})}]);if(r.status==="approved")actions.push(["Đánh dấu đã gửi",()=>action("quote","send",r.id)]);if(r.status==="sent")actions.push(["Ghi nhận khách chấp nhận",()=>{if(!confirm("Bạn đã nhận được xác nhận chấp nhận báo giá từ khách hàng bên ngoài hệ thống?"))return;const method=prompt("Kênh xác nhận: email, phone, in_person hoặc other:","email");if(method===null)return;if(!["email","phone","in_person","other"].includes(method.trim()))return alert("Kênh xác nhận không hợp lệ.");const note=prompt("Ghi nội dung và ngày xác nhận của khách (5–1000 ký tự):");if(note===null)return;if(note.trim().length<5||note.trim().length>1000)return alert("Nội dung xác nhận phải từ 5 đến 1000 ký tự.");action("quote","accept",r.id,{content:{method:method.trim(),note:note.trim()}})}]);{const version=versionByQuote.get(r.id);const amount=version?Number(version.total_amount):null;const desc=(quoteNames[r.status]||r.status)+(version?" · Phiên bản "+version.version_no+" · "+(Number.isFinite(amount)?new Intl.NumberFormat("vi-VN").format(amount)+" ₫":"Chưa có giá"):" · Chưa có phiên bản");line(q,r.title,desc,actions)}}const co=$("contracts");co.replaceChildren();for(const r of contracts){const actions=[];if(r.status==="draft")actions.push(["Trình xem xét",()=>action("contract","review",r.id)]);if(r.status==="review"&&sp.role==="admin")actions.push(["Xác nhận đã ký",()=>{if(confirm("Xác nhận đã có hợp đồng ký ngoài hệ thống?"))action("contract","sign",r.id)}]);if(r.status==="signed"&&sp.role==="admin")actions.push(["Kích hoạt",()=>action("contract","activate",r.id)]);if(r.status==="active"&&sp.role==="admin")actions.push(["Hoàn thành",()=>action("contract","complete",r.id)]);line(co,r.contract_number,contractNames[r.status]||r.status,actions)}$("audit").replaceChildren();for(const e of audit){const p=document.createElement("p");{const d=e.details||{};const note=d.reason?" · Lý do: "+d.reason:d.evidence?" · Xác nhận: "+(d.method||"")+" — "+d.evidence:"";p.textContent=new Date(e.created_at).toLocaleString("vi-VN")+" · "+(staffName.get(e.actor_id)||"Tài khoản nhân viên")+" · "+(e.entity_kind==="quote"?"Báo giá":"Hợp đồng")+" / "+(actionName[e.action]||e.action)+note;}$("audit").append(p)}alert("Đã tải dữ liệu. Quy trình ký chỉ ghi nhận trạng thái, không tạo chữ ký số.");return true}
$("create-quote").onclick=()=>action("quote","create",null,{inquiry:$("quote-inquiry").value,title:$("quote-title").value});$("create-contract").onclick=async()=>{const quoteId=$("contract-quote").value;if(!quoteId){alert("Cần có báo giá được khách chấp nhận trước khi tạo hợp đồng.");return}let match;try{match=await db.from("customer_quotes").select("inquiry_id,approved_version_id,status").eq("id",quoteId).single();}catch(error){alert("Không kiểm tra được báo giá. Thử lại sau.");return}if(match.error||!match.data){alert("Không kiểm tra được thông tin báo giá.");return}if(match.data.inquiry_id!==$("contract-inquiry").value){alert("Báo giá không thuộc khách hàng được chọn.");return}if(match.data.status!=="accepted"||!match.data.approved_version_id){alert("Báo giá chưa có phiên bản được duyệt và được khách chấp nhận.");return}action("contract","create",null,{inquiry:$("contract-inquiry").value,title:$("contract-number").value,content:{quote_id:quoteId,quote_version_id:match.data.approved_version_id}})};await load();
})();
</script></body></html>
