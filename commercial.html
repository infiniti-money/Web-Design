<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Báo giá & hợp đồng — Tân Design</title><style>body{font:15px/1.6 system-ui,sans-serif;background:#f4f6f2;color:#253b2d;margin:0}main{max-width:1100px;margin:auto;padding:28px}h1{font:38px Georgia,serif}.panel{background:white;border:1px solid #dce4d9;padding:20px;margin:16px 0;border-radius:10px}input,select,textarea,button{font:inherit;padding:9px;margin:5px;max-width:100%}button{background:#29583b;color:white;border:0;border-radius:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border-bottom:1px solid #ddd;padding:12px 0}.muted{color:#647368}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./admin.html">← Quản trị Tân Design</a><h1>Báo giá và hợp đồng</h1><p id="status" role="status">Đang xác thực...</p><div id="app" hidden><div class="grid"><section class="panel"><h2>Tạo báo giá</h2><label>Khách hàng <select id="quote-inquiry"></select></label><label>Tiêu đề <input id="quote-title" maxlength="180" placeholder="Báo giá thiết kế nội thất"></label><button id="create-quote">Tạo báo giá nháp</button><h2>Danh sách báo giá</h2><div id="quotes"></div></section><section class="panel"><h2>Tạo hợp đồng</h2><label>Khách hàng <select id="contract-inquiry"></select></label><label>Số hợp đồng <input id="contract-number" maxlength="90"></label><button id="create-contract">Tạo hợp đồng nháp</button><h2>Danh sách hợp đồng</h2><div id="contracts"></div></section></div><section class="panel"><h2>Lịch sử phê duyệt và thay đổi</h2><div id="audit"></div></section></div></main><script src="./app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script>
(async()=>{"use strict";const $=x=>document.getElementById(x),config=window.ATELIER_CONFIG;if(!config?.supabaseUrl||!config?.supabasePublishableKey||!window.supabase?.createClient){$("status").textContent="Kết nối chưa sẵn sàng";return}const db=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{user}}=await db.auth.getUser();if(!user){$("status").textContent="Vui lòng đăng nhập Admin";return}const {data:sp}=await db.from("staff_profiles").select("role,active").eq("user_id",user.id).single();if(!sp?.active||!["admin","manager"].includes(sp.role)||sp.role!==user.app_metadata?.role){$("status").textContent="Bạn không có quyền truy cập";return}$("app").hidden=false;const alert=t=>$("status").textContent=t;
async function action(kind,step,id,extra={}){const {error}=await db.rpc("commercial_action",{p_kind:kind,p_action:step,p_id:id||null,p_inquiry:extra.inquiry||null,p_title:extra.title||null,p_amount:extra.amount??null,p_content:extra.content||null});if(error){alert("Không thực hiện được: "+error.message);return}alert("Đã lưu thao tác: "+step);await load()}
function button(label,callback){const b=document.createElement("button");b.textContent=label;b.onclick=callback;return b}
function line(container,title,description,actions){const el=document.createElement("div");el.className="item";const heading=document.createElement("strong");heading.textContent=title;const p=document.createElement("p");p.className="muted";p.textContent=description;el.append(heading,p);actions.forEach(([name,cb])=>el.append(button(name,cb)));container.append(el)}
async function load(){const requests=await Promise.all([db.from("inquiries").select("id,full_name").limit(200),db.from("customer_quotes").select("id,title,status,inquiry_id").order("created_at",{ascending:false}).limit(200),db.from("customer_contracts").select("id,contract_number,status,inquiry_id").order("created_at",{ascending:false}).limit(200),db.from("commercial_audit").select("action,entity_kind,created_at").order("created_at",{ascending:false}).limit(50)]);if(requests.some(x=>x.error)){alert("Lỗi đọc dữ liệu hoặc chưa cài migration v1.17.0");return}const [inquiries,quotes,contracts,audit]=requests.map(x=>x.data||[]);for(const id of ["quote-inquiry","contract-inquiry"]){const select=$(id);select.replaceChildren();for(const i of inquiries){const option=document.createElement("option");option.value=i.id;option.textContent=i.full_name;select.append(option)}}const q=$("quotes");q.replaceChildren();for(const r of quotes){const actions=[];if(["draft","rejected"].includes(r.status)){actions.push(["Thêm phiên bản",()=>{const amount=prompt("Tổng tiền VND");if(amount===null)return;const n=Number(amount);if(!Number.isFinite(n)||n<0)return alert("Số tiền không hợp lệ");const description=prompt("Nội dung báo giá (diễn giải)");if(description===null)return;action("quote","revise",r.id,{amount:n,content:{description}})}],["Trình duyệt",()=>action("quote","submit",r.id)])}if(r.status==="submitted"&&sp.role==="admin")actions.push(["Duyệt",()=>action("quote","approve",r.id)],["Từ chối",()=>action("quote","reject",r.id)]);if(r.status==="approved")actions.push(["Đánh dấu đã gửi",()=>action("quote","send",r.id)]);if(r.status==="sent")actions.push(["Khách chấp nhận",()=>action("quote","accept",r.id)]);line(q,r.title,r.status,actions)}const co=$("contracts");co.replaceChildren();for(const r of contracts){const actions=[];if(r.status==="draft")actions.push(["Trình xem xét",()=>action("contract","review",r.id)]);if(r.status==="review"&&sp.role==="admin")actions.push(["Xác nhận đã ký",()=>{if(confirm("Xác nhận đã có hợp đồng ký ngoài hệ thống?"))action("contract","sign",r.id)}]);if(r.status==="signed"&&sp.role==="admin")actions.push(["Kích hoạt",()=>action("contract","activate",r.id)]);if(r.status==="active"&&sp.role==="admin")actions.push(["Hoàn thành",()=>action("contract","complete",r.id)]);line(co,r.contract_number,r.status,actions)}$("audit").replaceChildren();for(const e of audit){const p=document.createElement("p");p.textContent=new Date(e.created_at).toLocaleString("vi-VN")+" — "+e.entity_kind+" / "+e.action;$("audit").append(p)}alert("Đã tải dữ liệu. Quy trình ký chỉ ghi nhận trạng thái, không tạo chữ ký số.")}
$("create-quote").onclick=()=>action("quote","create",null,{inquiry:$("quote-inquiry").value,title:$("quote-title").value});$("create-contract").onclick=()=>action("contract","create",null,{inquiry:$("contract-inquiry").value,title:$("contract-number").value});await load();
})();
</script></body></html>
